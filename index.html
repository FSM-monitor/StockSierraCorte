<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sierra Corte | Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-dark: #111111;
      --accent: #dc2626;
      --accent-hover: #ef4444;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --border-color: #262626;
      --success: #10b981;
      --error: #dc2626;
    }
    
    * {
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    
    /* Glass effect */
    .glass {
      background: rgba(17, 17, 17, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }
    
    /* Loader animación */
    .loader {
      border-top-color: var(--accent);
      animation: spinner 1s linear infinite;
    }
    
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Scrollbar personalizado */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }
    
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #444;
    }
    
    /* Animación para detalles expandidos */
    .expanded-detail {
      animation: slideDown 0.3s ease-out forwards;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Efecto de brillo sutil en hover */
    .hover-glow:hover {
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.2);
    }
    
    /* Línea de acento decorativa */
    .accent-line {
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      margin-top: 8px;
      width: 80px;
    }
    
    /* Input estilizado */
    .premium-input {
      background-color: rgba(30, 30, 30, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      transition: all 0.3s ease;
    }
    
    .premium-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2);
    }
    
    /* Botón */
    .premium-btn {
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .premium-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    }
    
    .premium-btn:active {
      transform: translateY(0);
    }
    
    /* Badge para valores de stock */
    .stock-badge {
      background-color: rgba(220, 38, 38, 0.1);
      color: var(--accent);
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-block;
    }
    
    /* Badge para unidades (color diferente) */
    .units-badge {
      background-color: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-block;
    }
    
    /* Tabla estilizada */
    .premium-table th {
      font-weight: 600;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-color);
    }
    
    .premium-table tr {
      border-bottom: 1px solid rgba(38, 38, 38, 0.5);
    }
    
    .premium-table tr:hover {
      background-color: rgba(30, 30, 30, 0.5);
    }
  </style>
</head>
<body class="p-4 md:p-8 custom-scroll">

  <div class="max-w-6xl mx-auto">
    <!-- Header con diseño -->
    <div class="glass rounded-2xl p-6 mb-8 hover-glow">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div>
          <div class="flex items-center space-x-3">
            </div>
            <div>
              <h1 class="text-3xl font-bold tracking-tight text-white">
                Sierra Corte
              </h1>
              <div class="accent-line"></div>
            </div>
          </div>
          <p class="text-gray-400 text-sm mt-2 font-medium">Control de Stock en Tiempo Real</p>
        </div>
        
        <div class="flex flex-1 max-w-xl gap-3">
          <div class="relative flex-1">
            <input type="text" id="searchInput" onkeyup="filterData()" 
             placeholder="Filtrar por código o descripción..." 
             class="w-full premium-input rounded-xl py-3 px-4 placeholder-gray-500 font-medium shadow-inner">
            <div class="absolute right-3 top-3 text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
          </div>
          <button onclick="loadData()" class="premium-btn font-bold px-6 py-3 rounded-xl shadow-lg">
            Actualizar
          </button>
        </div>
      </div>
    </div>

    <!-- Contenedor principal de la tabla -->
    <div class="glass rounded-2xl overflow-hidden shadow-2xl hover-glow">
      <div class="overflow-x-auto">
        <table class="min-w-full premium-table text-left">
          <thead class="bg-black/30">
            <tr>
              <th class="px-6 py-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Código Artículo</th>
              <th class="px-6 py-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Descripción</th>
              <th class="px-6 py-4 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">Stock Actual</th>
              <th class="px-6 py-4 text-xs font-semibold text-gray-400 uppercase tracking-wider text-center">Detalle</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-800"></tbody>
        </table>
      </div>
      
      <!-- Loader -->
      <div id="loader" class="hidden flex flex-col justify-center items-center p-20 gap-4">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-800 h-12 w-12"></div>
        <p class="text-gray-500 font-medium animate-pulse">Sincronizando datos...</p>
      </div>

      <!-- Estado vacío -->
      <div id="emptyState" class="hidden p-20 text-center">
        <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-black to-gray-900 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
          </svg>
        </div>
        <p class="text-gray-500 text-lg font-medium">No se encontraron artículos con existencia.</p>
        <p class="text-gray-600 text-sm mt-2">Intente actualizar la búsqueda o verifique los filtros aplicados.</p>
      </div>
    </div>
    
    <!-- Footer minimalista -->
    <div class="mt-8 text-center text-gray-600 text-sm">
      <p>Dashboard Sierra Corte  • FSM • <span id="currentYear"></span></p>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby0mlheCboanya1IQiBzwjrvkUGF4GkHgKDAp_BzNKOEZNmh86n_TbgxQq_UI9Jtrs/exec"; 
    let rawData = [];
    
    // Lista de excepciones para artículos que usan "unidades" en lugar de "metros"
    // Se puede ampliar fácilmente agregando más códigos a este array
    const unidadesExcepciones = [
      "OG4500004",
      // Agregar más códigos aquí según sea necesario:
      // "EJEMPLO001",
      // "EJEMPLO002"
    ];

    // Función para determinar la unidad de medida según el código del artículo
    function obtenerUnidadMedida(codigo) {
      // Verificar si el código está en la lista de excepciones
      return unidadesExcepciones.includes(codigo.toString()) ? "unidades" : "metros";
    }
    
    // Función para obtener la clase CSS del badge según la unidad
    function obtenerClaseBadge(unidad) {
      return unidad === "unidades" ? "units-badge" : "stock-badge";
    }

    // Establecer año actual en el footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    window.onload = loadData;

    async function loadData() {
      const loader = document.getElementById('loader');
      const tableBody = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');
      
      loader.classList.remove('hidden');
      tableBody.innerHTML = '';
      emptyState.classList.add('hidden');

      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        
        rawData = data;
        renderTable(data);
      } catch (err) {
        console.error(err);
        // Mostrar notificación de error elegante
        showError("Error de conexión con el servidor");
      } finally {
        loader.classList.add('hidden');
      }
    }

    function showError(message) {
      // Crear elemento de notificación
      const notification = document.createElement('div');
      notification.className = 'fixed top-4 right-4 glass p-4 rounded-xl border-l-4 border-red-600 z-50 animate-slideIn';
      notification.innerHTML = `
        <div class="flex items-center">
          <div class="rounded-full bg-red-900/20 p-2 mr-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <div>
            <p class="font-medium text-white">Error</p>
            <p class="text-sm text-gray-400">${message}</p>
          </div>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      // Remover después de 5 segundos
      setTimeout(() => {
        notification.style.opacity = '0';
        notification.style.transform = 'translateX(20px)';
        setTimeout(() => {
          if (notification.parentNode) {
            notification.parentNode.removeChild(notification);
          }
        }, 300);
      }, 5000);
    }

    function renderTable(data) {
      const body = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');
      body.innerHTML = "";

      if (data.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden'); 
      }

      data.forEach((item) => {
        const safeId = item.codigo.toString().replace(/[^a-zA-Z0-9]/g, '_');
        const unidad = obtenerUnidadMedida(item.codigo);
        const badgeClass = obtenerClaseBadge(unidad);
        
        const row = document.createElement('tr');
        row.className = "hover:bg-gray-900/30 transition-colors cursor-pointer group";
        row.onclick = () => toggleDetail(safeId, item.codigo);
        
        row.innerHTML = `
          <td class="px-6 py-5">
            <div class="flex items-center space-x-3">
              <div class="font-mono text-sm font-semibold text-white bg-black/30 px-3 py-1.5 rounded-lg">
                ${item.codigo}
              </div>
              ${unidad === "unidades" ? 
                '<span class="text-xs bg-blue-900/30 text-blue-400 px-2 py-1 rounded-full">Unidades</span>' : 
                ''}
            </div>
          </td>
          <td class="px-6 py-5 text-sm text-gray-300 font-medium">${item.descripcion}</td>
          <td class="px-6 py-5 text-right">
            <div class="flex items-center justify-end space-x-2">
              <span class="font-bold text-xl text-white">${item.stock}</span>
              <span class="${badgeClass} text-xs">${unidad}</span>
            </div>
          </td>
          <td class="px-6 py-5 text-center">
            <span class="text-gray-600 group-hover:text-red-500 transition inline-block transform group-hover:scale-110" id="icon-${safeId}">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </span>
          </td>
        `;
        body.appendChild(row);

        const detailRow = document.createElement('tr');
        detailRow.id = `detail-${safeId}`;
        detailRow.className = "hidden bg-black/20";
        detailRow.innerHTML = `
          <td colspan="4" class="px-6 py-6">
            <div id="content-${safeId}" class="expanded-detail border border-gray-800 rounded-xl bg-black/40 overflow-hidden">
              <div class="p-8 text-center text-gray-500">
                 <div class="loader ease-linear rounded-full border-2 border-t-2 border-gray-700 h-6 w-6 mx-auto mb-2"></div>
                 <p class="text-sm font-medium">Cargando historial de movimientos...</p>
                 <p class="text-xs mt-1">Unidad: ${unidad}</p>
              </div>
            </div>
          </td>
        `;
        body.appendChild(detailRow);
      });
    }

    async function toggleDetail(safeId, codigoReal) {
      const detailRow = document.getElementById(`detail-${safeId}`);
      const contentBox = document.getElementById(`content-${safeId}`);
      const icon = document.getElementById(`icon-${safeId}`);
      const isOpening = detailRow.classList.contains('hidden');
      
      detailRow.classList.toggle('hidden');
      icon.style.transform = isOpening ? "rotate(180deg)" : "rotate(0deg)";

      if (isOpening && contentBox.dataset.loaded !== "true") {
        try {
          const response = await fetch(`${WEB_APP_URL}?codigo=${encodeURIComponent(codigoReal)}`);
          const movimientos = await response.json();
          renderHistory(contentBox, movimientos, codigoReal);
          contentBox.dataset.loaded = "true";
        } catch (err) {
          const unidad = obtenerUnidadMedida(codigoReal);
          contentBox.innerHTML = `
            <div class="p-6 text-center">
              <div class="w-12 h-12 mx-auto mb-4 rounded-full bg-red-900/20 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <p class="text-red-400 font-medium">Error al cargar el historial</p>
              <p class="text-gray-500 text-sm mt-1">Intente nuevamente más tarde</p>
            </div>`;
        }
      }
    }

    function renderHistory(container, movs, codigo) {
      const unidad = obtenerUnidadMedida(codigo);
      
      if (!movs || movs.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gray-900 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <p class="text-gray-500 font-medium">Sin movimientos registrados.</p>
            <p class="text-gray-600 text-sm mt-2">No hay historial disponible para este artículo.</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="p-1">
          <div class="flex items-center justify-between p-4 border-b border-gray-800">
            <div>
              <h3 class="text-lg font-semibold text-white">Historial de Movimientos</h3>
              <p class="text-xs text-gray-500 mt-1">Unidad: <span class="text-gray-400 font-medium">${unidad}</span></p>
            </div>
            <span class="text-xs text-gray-500 bg-black/40 px-3 py-1 rounded-full">${movs.length} registros</span>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="text-gray-500 bg-black/30">
                <tr>
                  <th class="px-4 py-3 text-left font-medium">Fecha</th>
                  <th class="px-4 py-3 text-left font-medium">Comprobante</th>
                  <th class="px-4 py-3 text-right font-medium">Cantidad (${unidad})</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-800/50">
                ${movs.map(m => {
                  // Formateo de fecha dd/mm/yyyy
                  let fechaStr = m.fecha;
                  try {
                    const d = new Date(m.fecha);
                    if(!isNaN(d)) {
                      fechaStr = d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    }
                  } catch(e) {}

                  const isPositive = m.cantidad > 0;
                  
                  return `
                    <tr class="hover:bg-gray-900/30">
                      <td class="px-4 py-3 text-gray-400 font-medium">${fechaStr}</td>
                      <td class="px-4 py-3 text-gray-300 font-mono">${m.comprobante || 'Sin comprobante'}</td>
                      <td class="px-4 py-3 text-right">
                        <span class="inline-flex items-center ${isPositive ? 'text-green-400' : 'text-red-400'} font-bold">
                          ${isPositive ? 
                            '<svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>' : 
                            '<svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>'
                          }
                          ${isPositive ? '+' : ''}${m.cantidad}
                        </span>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function filterData() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawData.filter(item => 
        item.codigo.toString().toLowerCase().includes(term) || 
        item.descripcion.toLowerCase().includes(term)
      );
      renderTable(filtered);
    }
    
    // Añadir animación de entrada para las notificaciones
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .animate-slideIn {
        animation: slideIn 0.3s ease-out forwards;
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
