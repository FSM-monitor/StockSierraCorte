<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .row-detail { transition: all 0.3s ease-out; max-height: 0; overflow: hidden; }
    .expanded .row-detail { max-height: 500px; overflow-y: auto; }
  </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">📦 Stock Depósito: SIERRA CORTE</h1>
      
      <div class="flex flex-col md:flex-row gap-4">
        <input type="text" id="searchInput" onkeyup="filterData()" 
               placeholder="Buscar por código o descripción..." 
               class="flex-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
          🔄 Actualizar
        </button>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-md overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Artículo</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descripción</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Existencia</th>
            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Acción</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
          </tbody>
      </table>
      
      <div id="loader" class="flex justify-center items-center p-10">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
      </div>
    </div>
  </div>

  <script>
    let rawData = [];

    // Carga inicial
    window.onload = loadData;

    function loadData() {
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('tableBody').innerHTML = '';
      
      google.script.run
        .withSuccessHandler(data => {
          rawData = data;
          renderTable(data);
          document.getElementById('loader').classList.add('hidden');
        })
        .withFailureHandler(err => {
          alert("Error: " + err.message);
          document.getElementById('loader').classList.add('hidden');
        })
        .getStockData();
    }

    function renderTable(data) {
      const body = document.getElementById('tableBody');
      body.innerHTML = '';

      data.forEach((item, index) => {
        const row = document.createElement('tr');
        row.id = `row-${index}`;
        row.className = "hover:bg-gray-50 transition cursor-pointer";
        row.innerHTML = `
          <td class="px-6 py-4 whitespace-nowrap font-mono text-sm text-blue-600">${item.codigo}</td>
          <td class="px-6 py-4 text-sm text-gray-600">${item.descripcion}</td>
          <td class="px-6 py-4 whitespace-nowrap text-right font-bold ${item.stock > 0 ? 'text-green-600' : 'text-red-600'}">${item.stock}</td>
          <td class="px-6 py-4 text-center">
            <button onclick="toggleDetail(${index})" class="text-blue-500 hover:text-blue-800 text-sm font-semibold">Ver Movs</button>
          </td>
        `;
        row.onclick = () => toggleDetail(index);
        body.appendChild(row);

        // Fila de detalle (oculta por defecto)
        const detailRow = document.createElement('tr');
        detailRow.id = `detail-${index}`;
        detailRow.className = "hidden bg-gray-50";
        detailRow.innerHTML = `
          <td colspan="4" class="px-6 py-4">
            <div class="border rounded-lg bg-white p-4 shadow-inner">
              <h4 class="font-bold text-xs uppercase text-gray-400 mb-2">Últimos Movimientos (Sierra Corte)</h4>
              <table class="min-w-full text-xs text-left">
                <thead>
                  <tr class="border-b">
                    <th class="py-1">Fecha</th>
                    <th class="py-1">Comprobante</th>
                    <th class="py-1">Circuito</th>
                    <th class="py-1 text-right">Cant.</th>
                  </tr>
                </thead>
                <tbody>
                  ${item.movimientos.map(m => `
                    <tr class="border-b border-gray-100">
                      <td class="py-1">${m.fecha}</td>
                      <td class="py-1">${m.comprobante}</td>
                      <td class="py-1">${m.circuito}</td>
                      <td class="py-1 text-right font-mono ${m.cantidad < 0 ? 'text-red-500' : 'text-blue-500'}">${m.cantidad}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </td>
        `;
        body.appendChild(detailRow);
      });
    }

    function toggleDetail(index) {
      const detail = document.getElementById(`detail-${index}`);
      detail.classList.toggle('hidden');
    }

    function filterData() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawData.filter(item => 
        item.codigo.toLowerCase().includes(term) || 
        item.descripcion.toLowerCase().includes(term)
      );
      renderTable(filtered);
    }
  </script>
</body>
</html>
